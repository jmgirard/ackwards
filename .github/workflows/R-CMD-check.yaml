# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
    # Skip the check matrix when a commit touches ONLY these process/meta docs.
    # All are .Rbuildignore'd, so R CMD check never sees them; a change here
    # cannot affect the build. Any non-doc file in the same commit still runs
    # the matrix. (pkgdown.yaml is intentionally NOT filtered -- it renders
    # these .md files into the site.)
    #
    # DELIBERATELY NOT IGNORED: cairn/DECISIONS.md, cairn/DESIGN.md, and
    # cairn/references/**. Those are .Rbuildignore'd like the rest of cairn/,
    # but tools/check-ledger-anchors.R reads them, and it runs as a step of
    # this workflow against the source checkout rather than the tarball. A
    # blanket 'cairn/**' would let exactly the commits that can break an
    # anchor -- renumbering a D-entry, deleting a reference note -- skip the
    # checker that exists to catch it. Keep any new cairn/ entry below out of
    # that set.
    paths-ignore:
      - 'CLAUDE.md'
      - 'cran-comments.md'
      - '.claude/**'
      - 'cairn/ROADMAP.md'
      - 'cairn/LESSONS.md'
      - 'cairn/PROFILE.md'
      - 'cairn/milestones/**'
      - 'cairn/legacy/**'
      - 'cairn/reviews/**'
  pull_request:
    branches: [main, master]
    # Identical to the push filter above; see its comment for the cairn/
    # carve-out.
    paths-ignore:
      - 'CLAUDE.md'
      - 'cran-comments.md'
      - '.claude/**'
      - 'cairn/ROADMAP.md'
      - 'cairn/LESSONS.md'
      - 'cairn/PROFILE.md'
      - 'cairn/milestones/**'
      - 'cairn/legacy/**'
      - 'cairn/reviews/**'

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          # Windows runs 2 testthat workers, not 4 -- see the TESTTHAT_CPUS
          # note under env: below.
          - {os: windows-latest, r: 'release', testthat-cpus: 2}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Parallel testthat (M48): hosted runners have 4 vCPUs; testthat
      # otherwise defaults to 2 workers.
      #
      # WINDOWS RUNS 2, NOT 4 (M83). At 4 workers a testthat worker
      # intermittently died on a Windows access violation (0xC0000005),
      # failing this job roughly 4% of the time -- in a different test file
      # each occurrence, so no single test was at fault. Measured with
      # windows-stress.yaml: 6 crashes / 60 iterations at 4 workers, 0 / 30 at
      # 2. Memory was never the constraint (~14 GB free at every crash), and
      # the same tests and compiled dependencies are exercised either way, so
      # the trigger is the 4-way concurrency itself.
      #
      # 2 also matches what CRAN effectively runs (_R_CHECK_LIMIT_CORES_),
      # which is consistent with CRAN's Windows flavours staying green while
      # this job flaked. Other platforms keep 4 and keep M48's speedup.
      TESTTHAT_CPUS: ${{ matrix.config.testthat-cpus || 4 }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Fail fast if a vignettes/*.Rmd.orig was edited without re-running
      # precompute.R (M65). Base R only, so it runs before dependency install;
      # it needs the source checkout (the .Rmd.orig are .Rbuildignore'd, so the
      # tarball R CMD check below cannot see this).
      - name: Check precomputed vignette freshness
        run: Rscript tools/check-vignette-freshness.R
        shell: bash

      # Fail fast if the departures ledger cites an anchor that no longer
      # resolves (M72). Base R only; needs the source checkout (cairn/ + tools/
      # are .Rbuildignore'd, so the tarball R CMD check below cannot see this).
      - name: Check departures-ledger anchor integrity
        run: Rscript tools/check-ledger-anchors.R
        shell: bash

      # Fail fast if a paths-ignore filter has gone stale or been widened to
      # cover a path the ledger check reads (M82). Needs the source checkout
      # (.github/ is .Rbuildignore'd).
      - name: Check CI paths-ignore filters
        run: Rscript tools/check-ci-path-filters.R
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
